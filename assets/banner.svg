<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Main Title -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#ec4899;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="pitchGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCircle {
      0% { r: 6; opacity: 1; }
      50% { r: 18; opacity: 0.3; }
      100% { r: 28; opacity: 0; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(320px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    .pulse-1 { animation: pulseCircle 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .pulse-2 { animation: pulseCircle 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 0.8s; }
    .pulse-3 { animation: pulseCircle 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.6s; }
    .dash-line { stroke-dasharray: 8 6; animation: dashMove 4s linear infinite; }
    .floating-hud { animation: floatBox 4s ease-in-out infinite; }
    .scanner { animation: scanLine 6s ease-in-out infinite; }
    .tactical-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Right-side Tactical Pitch Diagram -->
  <g transform="translate(780, 40)" opacity="0.85">
    <!-- Pitch Outline -->
    <rect x="0" y="0" width="370" height="280" rx="12" fill="url(#pitchGlow)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Pitch Midline & Center Circle -->
    <line x1="185" y1="0" x2="185" y2="280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <circle cx="185" cy="140" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Penalty Boxes -->
    <rect x="0" y="70" width="60" height="140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="310" y="70" width="60" height="140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Player Tracking Nodes with Pulse Rings -->
    <!-- Player A (Blue) -->
    <g transform="translate(90, 110)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" class="pulse-1"/>
      <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#glow)"/>
      <text x="12" y="4" fill="#38bdf8" font-size="11" font-weight="bold" class="tactical-font">P07 (Striker)</text>
    </g>

    <!-- Player B (Cyan) -->
    <g transform="translate(160, 200)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#34d399" class="pulse-2"/>
      <circle cx="0" cy="0" r="6" fill="#34d399" filter="url(#glow)"/>
      <text x="12" y="4" fill="#34d399" font-size="11" font-weight="bold" class="tactical-font">P10 (Midfield)</text>
    </g>

    <!-- Player C (Violet) -->
    <g transform="translate(260, 95)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#a855f7" class="pulse-3"/>
      <circle cx="0" cy="0" r="6" fill="#a855f7" filter="url(#glow)"/>
      <text x="12" y="4" fill="#c084fc" font-size="11" font-weight="bold" class="tactical-font">P04 (Defender)</text>
    </g>

    <!-- Ball & Velocity Vector Trajectory -->
    <path d="M 160 200 Q 200 130 90 110" fill="none" stroke="#f59e0b" stroke-width="2.5" class="dash-line" filter="url(#glow)"/>
    <circle cx="120" cy="148" r="4.5" fill="#fbbf24" filter="url(#strongGlow)">
      <animate attributeName="cx" values="160;120;90;160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;148;110;200" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- AI Bounding Box Floating HUD -->
    <g class="floating-hud" transform="translate(70, 75)">
      <rect x="0" y="0" width="85" height="65" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 3"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#38bdf8" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38bdf8" stroke-width="3"/>
      <line x1="85" y1="0" x2="77" y2="0" stroke="#38bdf8" stroke-width="3"/>
      <line x1="85" y1="0" x2="85" y2="8" stroke="#38bdf8" stroke-width="3"/>
      <line x1="0" y1="65" x2="8" y2="65" stroke="#38bdf8" stroke-width="3"/>
      <line x1="0" y1="65" x2="0" y2="57" stroke="#38bdf8" stroke-width="3"/>
      <line x1="85" y1="65" x2="77" y2="65" stroke="#38bdf8" stroke-width="3"/>
      <line x1="85" y1="65" x2="85" y2="57" stroke="#38bdf8" stroke-width="3"/>
      <!-- Small HUD Label -->
      <rect x="0" y="-18" width="68" height="15" fill="#0284c7" rx="3"/>
      <text x="4" y="-7" fill="#ffffff" font-size="9" font-weight="bold" class="tactical-font">YOLOv8 98.4%</text>
    </g>
  </g>

  <!-- Left/Center Branding Section -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="265" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#10b981" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="27" y="18" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.2" class="tactical-font">SPORTS COMPUTER VISION &amp; SAAS</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" fill="url(#titleShimmer)" font-size="44" font-weight="900" letter-spacing="-0.5" class="tactical-font" filter="url(#glow)">
        Awesome Video Analysis
      </text>
      <text x="0" y="38" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.2" class="tactical-font">
        Tactical Analysis, Tracking &amp; Sports Intelligence
      </text>
    </g>

    <!-- Description / Subtext -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="400" class="tactical-font">
        Curated ecosystem of elite SaaS platforms, open-source AI frameworks,
      </text>
      <text x="0" y="22" fill="#94a3b8" font-size="14" font-weight="400" class="tactical-font">
        computer vision models, multi-object tracking, and kinematic motion tools.
      </text>
    </g>

    <!-- Feature Tags Pill Row -->
    <g transform="translate(0, 268)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="17" fill="#38bdf8" font-size="11" font-weight="600" class="tactical-font">Object Tracking</text>
      
      <!-- Tag 2 -->
      <rect x="135" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <text x="147" y="17" fill="#34d399" font-size="11" font-weight="600" class="tactical-font">Telestration &amp; Tag</text>

      <!-- Tag 3 -->
      <rect x="285" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="297" y="17" fill="#c084fc" font-size="11" font-weight="600" class="tactical-font">Pose Estimation</text>

      <!-- Tag 4 -->
      <rect x="425" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
      <text x="437" y="17" fill="#fbbf24" font-size="11" font-weight="600" class="tactical-font">Match Analytics</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
